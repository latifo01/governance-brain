[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gov360-brain"
version = "0.1.0"
description = "Evidence-first, model-agnostic governance knowledge ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "charset-normalizer>=3.4,<4",
  "fonttools>=4.59,<5",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pypdf>=6,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
data = ["duckdb>=1.3,<2", "pyarrow>=20,<24"]
office-windows = ["pywin32>=310; sys_platform == 'win32'"]
pdf-advanced = ["docling>=2.60,<3", "pdfplumber>=0.11,<1"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[project.scripts]
gov360 = "gov360_brain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gov360_brain"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest_tmp"
testpaths = ["tests"]
